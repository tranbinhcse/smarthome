mqtt:
  broker: tcp://mosquitto:1883   # user/mật khẩu lấy từ .env (HUBD_MQTT_USER/PASS)

http:
  listen: ":8080"

db: /db/hubd.db

# Phòng/khu theo tầng. type: panel = tủ điện của tầng (dashboard hiện thành dải CB, không phải phòng).
# Thiết bị gán phòng bằng `zone` (Tuya: sửa tuya/overrides.json rồi chạy gen_config.py).
zones:
  - { id: santruoc,   name: "Sân trước",      floor: 1, type: outdoor }
  - { id: cafe,       name: "Khu cafe",       floor: 1 }
  - { id: bep,        name: "Bếp",            floor: 1 }
  - { id: kho,        name: "Phòng kho",      floor: 1 }
  - { id: wc,         name: "WC",             floor: 1 }
  - { id: sansau,     name: "Sân sau",        floor: 1, type: outdoor }
  - { id: tudien1,    name: "Tủ điện tầng 1", floor: 1, type: panel }
  - { id: lamviec,    name: "Phòng làm việc", floor: 2 }
  - { id: ngu1,       name: "Phòng ngủ 1",    floor: 2 }
  - { id: ngu2,       name: "Phòng ngủ 2",    floor: 2 }
  - { id: docsach,    name: "Phòng đọc sách", floor: 2 }
  - { id: tudien2,    name: "Tủ điện tầng 2", floor: 2, type: panel }
  - { id: kythuat,    name: "Tum kỹ thuật",   floor: 3 }
  - { id: gieng_troi, name: "Giếng trời",     floor: 3, type: outdoor }

# Số đo: giá trị lấy từ một topic MQTT. field/scale: đọc một khoá trong payload JSON rồi nhân hệ số.
# device: hiện số đo trên thẻ của thiết bị đó.
entities:
  # BEGIN tuya-entities (gen_config.py — đừng sửa tay)
  - {"id": "tuya_ebae9da4b1b5eeec58d8ci.a", "name": "Dòng điện", "unit": "A", "topic": "tuya/ebae9da4b1b5eeec58d8ci/dps", "field": "18", "scale": 0.001, "zone": "cafe", "device": "tuya_ebae9da4b1b5eeec58d8ci"}
  - {"id": "tuya_ebae9da4b1b5eeec58d8ci.w", "name": "Công suất", "unit": "W", "topic": "tuya/ebae9da4b1b5eeec58d8ci/dps", "field": "19", "scale": 0.1, "zone": "cafe", "device": "tuya_ebae9da4b1b5eeec58d8ci"}
  - {"id": "tuya_ebae9da4b1b5eeec58d8ci.v", "name": "Điện áp", "unit": "V", "topic": "tuya/ebae9da4b1b5eeec58d8ci/dps", "field": "20", "scale": 0.1, "zone": "cafe", "device": "tuya_ebae9da4b1b5eeec58d8ci"}
  - {"id": "tuya_eb6564a5a81a53bb8ayyzs.a", "name": "Dòng điện", "unit": "A", "topic": "tuya/eb6564a5a81a53bb8ayyzs/dps", "field": "18", "scale": 0.001, "zone": "tudien1", "device": "tuya_eb6564a5a81a53bb8ayyzs"}
  - {"id": "tuya_eb6564a5a81a53bb8ayyzs.w", "name": "Công suất", "unit": "W", "topic": "tuya/eb6564a5a81a53bb8ayyzs/dps", "field": "19", "scale": 0.1, "zone": "tudien1", "device": "tuya_eb6564a5a81a53bb8ayyzs"}
  - {"id": "tuya_eb6564a5a81a53bb8ayyzs.v", "name": "Điện áp", "unit": "V", "topic": "tuya/eb6564a5a81a53bb8ayyzs/dps", "field": "20", "scale": 0.1, "zone": "tudien1", "device": "tuya_eb6564a5a81a53bb8ayyzs"}
  - {"id": "tuya_eb0651481bdbe0ca6bvyt0.a", "name": "Dòng điện", "unit": "A", "topic": "tuya/eb0651481bdbe0ca6bvyt0/dps", "field": "18", "scale": 0.001, "zone": "tudien1", "device": "tuya_eb0651481bdbe0ca6bvyt0"}
  - {"id": "tuya_eb0651481bdbe0ca6bvyt0.w", "name": "Công suất", "unit": "W", "topic": "tuya/eb0651481bdbe0ca6bvyt0/dps", "field": "19", "scale": 0.1, "zone": "tudien1", "device": "tuya_eb0651481bdbe0ca6bvyt0"}
  - {"id": "tuya_eb0651481bdbe0ca6bvyt0.v", "name": "Điện áp", "unit": "V", "topic": "tuya/eb0651481bdbe0ca6bvyt0/dps", "field": "20", "scale": 0.1, "zone": "tudien1", "device": "tuya_eb0651481bdbe0ca6bvyt0"}
  - {"id": "tuya_eb700adf4ac4134fea2mrg.a", "name": "Dòng điện", "unit": "A", "topic": "tuya/eb700adf4ac4134fea2mrg/dps", "field": "18", "scale": 0.001, "zone": "tudien1", "device": "tuya_eb700adf4ac4134fea2mrg"}
  - {"id": "tuya_eb700adf4ac4134fea2mrg.w", "name": "Công suất", "unit": "W", "topic": "tuya/eb700adf4ac4134fea2mrg/dps", "field": "19", "scale": 0.1, "zone": "tudien1", "device": "tuya_eb700adf4ac4134fea2mrg"}
  - {"id": "tuya_eb700adf4ac4134fea2mrg.v", "name": "Điện áp", "unit": "V", "topic": "tuya/eb700adf4ac4134fea2mrg/dps", "field": "20", "scale": 0.1, "zone": "tudien1", "device": "tuya_eb700adf4ac4134fea2mrg"}
  - {"id": "tuya_ebba01d29a86b4f29dlrgx.a", "name": "Dòng điện", "unit": "A", "topic": "tuya/ebba01d29a86b4f29dlrgx/dps", "field": "18", "scale": 0.001, "zone": "tudien2", "device": "tuya_ebba01d29a86b4f29dlrgx"}
  - {"id": "tuya_ebba01d29a86b4f29dlrgx.w", "name": "Công suất", "unit": "W", "topic": "tuya/ebba01d29a86b4f29dlrgx/dps", "field": "19", "scale": 0.1, "zone": "tudien2", "device": "tuya_ebba01d29a86b4f29dlrgx"}
  - {"id": "tuya_ebba01d29a86b4f29dlrgx.v", "name": "Điện áp", "unit": "V", "topic": "tuya/ebba01d29a86b4f29dlrgx/dps", "field": "20", "scale": 0.1, "zone": "tudien2", "device": "tuya_ebba01d29a86b4f29dlrgx"}
  # END tuya-entities
  # Năng lượng: inverter + 3 pack JK qua node RS485 (chưa lắp — hiện "—" tới khi có dữ liệu).
  # Inverter: lược đồ chung nangluong/inverter/<khoá> cho mọi hãng (firmware/inverter/README.md);
  # id giữ tên deye.* vì dashboard dùng. grid: + mua / − bán; battery: + sạc / − xả.
  - { id: deye.pv,              name: "Điện mặt trời",         unit: "W",   topic: nangluong/inverter/pv_power,        zone: kythuat }
  - { id: deye.load,            name: "Tải tiêu thụ",          unit: "W",   topic: nangluong/inverter/load_power,      zone: kythuat }
  - { id: deye.grid,            name: "Điện lưới",             unit: "W",   topic: nangluong/inverter/grid_power,      zone: kythuat }
  - { id: deye.battery,         name: "Pin sạc/xả (inverter)", unit: "W",   topic: nangluong/inverter/battery_power,   zone: kythuat }
  - { id: deye.soc,             name: "SOC pin (inverter)",    unit: "%",   topic: nangluong/inverter/battery_soc,     zone: kythuat }
  - { id: deye.grid_v,          name: "Điện áp lưới",          unit: "V",   topic: nangluong/inverter/grid_voltage,    zone: kythuat }
  - { id: deye.grid_hz,         name: "Tần số lưới",           unit: "Hz",  topic: nangluong/inverter/grid_frequency,  zone: kythuat }
  - { id: deye.temp,            name: "Nhiệt độ inverter",     unit: "°C",  topic: nangluong/inverter/temperature,     zone: kythuat }
  - { id: deye.pv_today,        name: "Điện mặt trời hôm nay", unit: "kWh", topic: nangluong/inverter/pv_today,        zone: kythuat }
  - { id: deye.load_today,      name: "Tiêu thụ hôm nay",      unit: "kWh", topic: nangluong/inverter/load_today,      zone: kythuat }
  - { id: deye.buy_today,       name: "Mua lưới hôm nay",      unit: "kWh", topic: nangluong/inverter/buy_today,       zone: kythuat }
  - { id: deye.sell_today,      name: "Bán lưới hôm nay",      unit: "kWh", topic: nangluong/inverter/sell_today,      zone: kythuat }
  - { id: deye.charge_today,    name: "Sạc pin hôm nay",       unit: "kWh", topic: nangluong/inverter/charge_today,    zone: kythuat }
  - { id: deye.discharge_today, name: "Xả pin hôm nay",        unit: "kWh", topic: nangluong/inverter/discharge_today, zone: kythuat }
  # Pin: 3 pack JK-PB song song qua node năng lượng (firmware/jk-bms, lược đồ MQTT ở README trong đó).
  # jk.<số đo> là tổng: SOC trung bình theo dung lượng Σ(SOC×Ah)/ΣAh; công suất, dòng cộng dồn (+ sạc, − xả);
  # điện áp trung bình; nhiệt, cell, chênh lệch lấy pack xấu nhất; chỉ gộp các pack đang kết nối (jk.online).
  # jk.p<n>.<số đo>: từng pack, n = địa chỉ DIP (0 = master). Cell tính bằng mV.
  - { id: jk.soc,           name: "Pin lưu trữ",             unit: "%",  topic: nangluong/jk/soc,              zone: kythuat }
  - { id: jk.power,         name: "Pin sạc/xả",              unit: "W",  topic: nangluong/jk/power,            zone: kythuat }
  - { id: jk.voltage,       name: "Pin điện áp",             unit: "V",  topic: nangluong/jk/voltage,          zone: kythuat }
  - { id: jk.current,       name: "Pin dòng điện",           unit: "A",  topic: nangluong/jk/current,          zone: kythuat }
  - { id: jk.temp,          name: "Pin nóng nhất",           unit: "°C", topic: nangluong/jk/temp,             zone: kythuat }
  - { id: jk.cell_min,      name: "Cell thấp nhất",          unit: "mV", topic: nangluong/jk/cell_min,         zone: kythuat }
  - { id: jk.cell_max,      name: "Cell cao nhất",           unit: "mV", topic: nangluong/jk/cell_max,         zone: kythuat }
  - { id: jk.cell_delta,    name: "Chênh lệch cell",         unit: "mV", topic: nangluong/jk/cell_delta,       zone: kythuat }
  - { id: jk.cycles,        name: "Số chu kỳ pin",           unit: "",   topic: nangluong/jk/cycles,           zone: kythuat }
  - { id: jk.alarms,        name: "Lỗi BMS",                 unit: "",   topic: nangluong/jk/alarms,           zone: kythuat }
  - { id: jk.online,        name: "Pack đang kết nối",       unit: "",   topic: nangluong/jk/online,           zone: kythuat }
  - { id: jk.p0.soc,        name: "Pack 0 SOC",              unit: "%",  topic: nangluong/jk/p0/soc,           zone: kythuat }
  - { id: jk.p0.voltage,    name: "Pack 0 điện áp",          unit: "V",  topic: nangluong/jk/p0/voltage,       zone: kythuat }
  - { id: jk.p0.current,    name: "Pack 0 dòng điện",        unit: "A",  topic: nangluong/jk/p0/current,       zone: kythuat }
  - { id: jk.p0.power,      name: "Pack 0 sạc/xả",           unit: "W",  topic: nangluong/jk/p0/power,         zone: kythuat }
  - { id: jk.p0.temp,       name: "Pack 0 nóng nhất",        unit: "°C", topic: nangluong/jk/p0/temp,          zone: kythuat }
  - { id: jk.p0.cell_min,   name: "Pack 0 cell thấp nhất",   unit: "mV", topic: nangluong/jk/p0/cell_min,      zone: kythuat }
  - { id: jk.p0.cell_max,   name: "Pack 0 cell cao nhất",    unit: "mV", topic: nangluong/jk/p0/cell_max,      zone: kythuat }
  - { id: jk.p0.cell_delta, name: "Pack 0 chênh lệch cell",  unit: "mV", topic: nangluong/jk/p0/cell_delta,    zone: kythuat }
  - { id: jk.p0.cycles,     name: "Pack 0 số chu kỳ",        unit: "",   topic: nangluong/jk/p0/cycles,        zone: kythuat }
  - { id: jk.p0.alarms,     name: "Pack 0 số lỗi",           unit: "",   topic: nangluong/jk/p0/alarms,        zone: kythuat }
  - { id: jk.p0.errors,     name: "Pack 0 lỗi",              unit: "",   topic: nangluong/jk/p0/errors,        zone: kythuat }
  - { id: jk.p1.soc,        name: "Pack 1 SOC",              unit: "%",  topic: nangluong/jk/p1/soc,           zone: kythuat }
  - { id: jk.p1.voltage,    name: "Pack 1 điện áp",          unit: "V",  topic: nangluong/jk/p1/voltage,       zone: kythuat }
  - { id: jk.p1.current,    name: "Pack 1 dòng điện",        unit: "A",  topic: nangluong/jk/p1/current,       zone: kythuat }
  - { id: jk.p1.power,      name: "Pack 1 sạc/xả",           unit: "W",  topic: nangluong/jk/p1/power,         zone: kythuat }
  - { id: jk.p1.temp,       name: "Pack 1 nóng nhất",        unit: "°C", topic: nangluong/jk/p1/temp,          zone: kythuat }
  - { id: jk.p1.cell_min,   name: "Pack 1 cell thấp nhất",   unit: "mV", topic: nangluong/jk/p1/cell_min,      zone: kythuat }
  - { id: jk.p1.cell_max,   name: "Pack 1 cell cao nhất",    unit: "mV", topic: nangluong/jk/p1/cell_max,      zone: kythuat }
  - { id: jk.p1.cell_delta, name: "Pack 1 chênh lệch cell",  unit: "mV", topic: nangluong/jk/p1/cell_delta,    zone: kythuat }
  - { id: jk.p1.cycles,     name: "Pack 1 số chu kỳ",        unit: "",   topic: nangluong/jk/p1/cycles,        zone: kythuat }
  - { id: jk.p1.alarms,     name: "Pack 1 số lỗi",           unit: "",   topic: nangluong/jk/p1/alarms,        zone: kythuat }
  - { id: jk.p1.errors,     name: "Pack 1 lỗi",              unit: "",   topic: nangluong/jk/p1/errors,        zone: kythuat }
  - { id: jk.p2.soc,        name: "Pack 2 SOC",              unit: "%",  topic: nangluong/jk/p2/soc,           zone: kythuat }
  - { id: jk.p2.voltage,    name: "Pack 2 điện áp",          unit: "V",  topic: nangluong/jk/p2/voltage,       zone: kythuat }
  - { id: jk.p2.current,    name: "Pack 2 dòng điện",        unit: "A",  topic: nangluong/jk/p2/current,       zone: kythuat }
  - { id: jk.p2.power,      name: "Pack 2 sạc/xả",           unit: "W",  topic: nangluong/jk/p2/power,         zone: kythuat }
  - { id: jk.p2.temp,       name: "Pack 2 nóng nhất",        unit: "°C", topic: nangluong/jk/p2/temp,          zone: kythuat }
  - { id: jk.p2.cell_min,   name: "Pack 2 cell thấp nhất",   unit: "mV", topic: nangluong/jk/p2/cell_min,      zone: kythuat }
  - { id: jk.p2.cell_max,   name: "Pack 2 cell cao nhất",    unit: "mV", topic: nangluong/jk/p2/cell_max,      zone: kythuat }
  - { id: jk.p2.cell_delta, name: "Pack 2 chênh lệch cell",  unit: "mV", topic: nangluong/jk/p2/cell_delta,    zone: kythuat }
