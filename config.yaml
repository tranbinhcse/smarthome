# Luật tự động hoá (ví dụ, bỏ # để bật). Thiết bị protected không bao giờ bị luật tắt.
# rules:
#   - id: co2_cao
#     entity: demo.co2
#     above: 1000
#     clear_below: 900
#     for: 2m
#     then:     [ { set: tuya_xxx, to: on } ]
#     on_clear: [ { set: tuya_xxx, to: off } ]

# Cảnh báo pin 3 pack JK (ngưỡng khởi điểm cho LiFePO4, chỉnh lại sau 2 tuần chạy thật — thiết kế mục 10).
# alert: hiện ở chuông trên dashboard (state "alert:<id>"); chưa gửi Telegram. Kịch bản thử: testdata/jk/.
rules:
  - { id: pin_yeu,         entity: jk.soc,        below: 20,   clear_above: 25,   for: 1m,  alert: "Pin lưu trữ dưới 20%" }
  - { id: pin_cell_thap,   entity: jk.cell_min,   below: 2900, clear_above: 3000, for: 30s, alert: "Có cell pin dưới 2,90 V" }
  - { id: pin_cell_cao,    entity: jk.cell_max,   above: 3600, clear_below: 3500, for: 30s, alert: "Có cell pin trên 3,60 V" }
  - { id: pin_lech_cell,   entity: jk.cell_delta, above: 50,   clear_below: 30,   for: 2m,  alert: "Chênh lệch cell pin trên 50 mV" }
  - { id: pin_qua_nhiet,   entity: jk.temp,       above: 45,   clear_below: 40,   for: 1m,  alert: "Pin hoặc BMS nóng trên 45°C" }
  - { id: pin_bms_loi,     entity: jk.alarms,     above: 0,                       for: 30s, alert: "BMS pin đang báo lỗi" }
  - { id: pin_mat_ket_noi, entity: jk.online,     below: 3,                       for: 2m,  alert: "Mất kết nối với pack pin" }
