  # Sự kiện camera từ hikbridge (ON/OFF, hub đọc thành 1/0 nên dùng được trong luật với above: 0.5).
  # Topic hik/<kênh>/<eventType viết thường>: vmd chuyển động, linedetection vượt hàng rào ảo, fielddetection
  # xâm nhập vùng, human/vehicle khi camera nhận ra người/xe. Bỏ # sau khi bật camera (README mục Camera).
  # - { id: cam_santruoc.vmd,   name: "Chuyển động", topic: hik/1/vmd,   zone: santruoc, device: cam_santruoc }
  # - { id: cam_santruoc.human, name: "Có người",    topic: hik/1/human, zone: santruoc, device: cam_santruoc }

# Thiết bị Tuya: phần giữa BEGIN/END do tuya-bridge/gen_config.py sinh từ tuya/devices.json.
