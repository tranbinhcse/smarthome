mqtt:
  broker: tcp://mosquitto:1883   # user/mật khẩu lấy từ .env (HUBD_MQTT_USER/PASS)

http:
  listen: ":8080"

db: /db/hubd.db

# Phòng/khu theo tầng. type: panel = tủ điện của tầng (dashboard hiện thành dải CB, không phải phòng).
# Thiết bị gán phòng bằng `zone` (Tuya: sửa tuya/overrides.json rồi chạy gen_config.py).
zones:
  - { id: santruoc,   name: "Sân trước",      floor: 1, type: outdoor }
  - { id: cafe,       name: "Khu cafe",       floor: 1 }
  - { id: bep,        name: "Bếp",            floor: 1 }
  - { id: kho,        name: "Phòng kho",      floor: 1 }
  - { id: wc,         name: "WC",             floor: 1 }
  - { id: sansau,     name: "Sân sau",        floor: 1, type: outdoor }
  - { id: tudien1,    name: "Tủ điện tầng 1", floor: 1, type: panel }
  - { id: lamviec,    name: "Phòng làm việc", floor: 2 }
  - { id: ngu1,       name: "Phòng ngủ 1",    floor: 2 }
  - { id: ngu2,       name: "Phòng ngủ 2",    floor: 2 }
  - { id: docsach,    name: "Phòng đọc sách", floor: 2 }
  - { id: tudien2,    name: "Tủ điện tầng 2", floor: 2, type: panel }
  - { id: kythuat,    name: "Tum kỹ thuật",   floor: 3 }
  - { id: gieng_troi, name: "Giếng trời",     floor: 3, type: outdoor }

# Số đo: giá trị lấy từ một topic MQTT. field/scale: đọc một khoá trong payload JSON rồi nhân hệ số.
# device: hiện số đo trên thẻ của thiết bị đó.
entities:
  # CB Tổng Phòng Lạnh có đo điện (dps Tuya: 19 = W×10, 20 = V×10, 18 = mA)
  - { id: cb_phonglanh.w, name: "Công suất", unit: "W", topic: tuya/ebae9da4b1b5eeec58d8ci/dps, field: "19", scale: 0.1, zone: cafe, device: tuya_ebae9da4b1b5eeec58d8ci }
  - { id: cb_phonglanh.v, name: "Điện áp", unit: "V", topic: tuya/ebae9da4b1b5eeec58d8ci/dps, field: "20", scale: 0.1, zone: cafe, device: tuya_ebae9da4b1b5eeec58d8ci }
  - { id: cb_phonglanh.a, name: "Dòng điện", unit: "A", topic: tuya/ebae9da4b1b5eeec58d8ci/dps, field: "18", scale: 0.001, zone: cafe, device: tuya_ebae9da4b1b5eeec58d8ci }
  # Năng lượng: Deye + 3 pack JK qua node RS485 (chưa lắp — hiện "—" tới khi có dữ liệu)
  - { id: deye.pv,   name: "Điện mặt trời", unit: "W", topic: nangluong/deye/pv_power,   zone: kythuat }
  - { id: deye.load, name: "Tải tiêu thụ",  unit: "W", topic: nangluong/deye/load_power, zone: kythuat }
  - { id: deye.grid, name: "Điện lưới",     unit: "W", topic: nangluong/deye/grid_power, zone: kythuat }
  # Pin: 3 pack JK-PB song song qua node năng lượng (firmware/jk-bms, lược đồ MQTT ở README trong đó).
  # jk.<số đo> là tổng: SOC trung bình theo dung lượng Σ(SOC×Ah)/ΣAh; công suất, dòng cộng dồn (+ sạc, − xả);
  # điện áp trung bình; nhiệt, cell, chênh lệch lấy pack xấu nhất; chỉ gộp các pack đang kết nối (jk.online).
  # jk.p<n>.<số đo>: từng pack, n = địa chỉ DIP (0 = master). Cell tính bằng mV.
  - { id: jk.soc,           name: "Pin lưu trữ",             unit: "%",  topic: nangluong/jk/soc,              zone: kythuat }
  - { id: jk.power,         name: "Pin sạc/xả",              unit: "W",  topic: nangluong/jk/power,            zone: kythuat }
  - { id: jk.voltage,       name: "Pin điện áp",             unit: "V",  topic: nangluong/jk/voltage,          zone: kythuat }
  - { id: jk.current,       name: "Pin dòng điện",           unit: "A",  topic: nangluong/jk/current,          zone: kythuat }
  - { id: jk.temp,          name: "Pin nóng nhất",           unit: "°C", topic: nangluong/jk/temp,             zone: kythuat }
  - { id: jk.cell_min,      name: "Cell thấp nhất",          unit: "mV", topic: nangluong/jk/cell_min,         zone: kythuat }
  - { id: jk.cell_max,      name: "Cell cao nhất",           unit: "mV", topic: nangluong/jk/cell_max,         zone: kythuat }
  - { id: jk.cell_delta,    name: "Chênh lệch cell",         unit: "mV", topic: nangluong/jk/cell_delta,       zone: kythuat }
  - { id: jk.cycles,        name: "Số chu kỳ pin",           unit: "",   topic: nangluong/jk/cycles,           zone: kythuat }
  - { id: jk.alarms,        name: "Lỗi BMS",                 unit: "",   topic: nangluong/jk/alarms,           zone: kythuat }
  - { id: jk.online,        name: "Pack đang kết nối",       unit: "",   topic: nangluong/jk/online,           zone: kythuat }
  - { id: jk.p0.soc,        name: "Pack 0 SOC",              unit: "%",  topic: nangluong/jk/p0/soc,           zone: kythuat }
  - { id: jk.p0.voltage,    name: "Pack 0 điện áp",          unit: "V",  topic: nangluong/jk/p0/voltage,       zone: kythuat }
  - { id: jk.p0.current,    name: "Pack 0 dòng điện",        unit: "A",  topic: nangluong/jk/p0/current,       zone: kythuat }
  - { id: jk.p0.power,      name: "Pack 0 sạc/xả",           unit: "W",  topic: nangluong/jk/p0/power,         zone: kythuat }
  - { id: jk.p0.temp,       name: "Pack 0 nóng nhất",        unit: "°C", topic: nangluong/jk/p0/temp,          zone: kythuat }
  - { id: jk.p0.cell_min,   name: "Pack 0 cell thấp nhất",   unit: "mV", topic: nangluong/jk/p0/cell_min,      zone: kythuat }
  - { id: jk.p0.cell_max,   name: "Pack 0 cell cao nhất",    unit: "mV", topic: nangluong/jk/p0/cell_max,      zone: kythuat }
  - { id: jk.p0.cell_delta, name: "Pack 0 chênh lệch cell",  unit: "mV", topic: nangluong/jk/p0/cell_delta,    zone: kythuat }
  - { id: jk.p0.cycles,     name: "Pack 0 số chu kỳ",        unit: "",   topic: nangluong/jk/p0/cycles,        zone: kythuat }
  - { id: jk.p0.alarms,     name: "Pack 0 số lỗi",           unit: "",   topic: nangluong/jk/p0/alarms,        zone: kythuat }
  - { id: jk.p0.errors,     name: "Pack 0 lỗi",              unit: "",   topic: nangluong/jk/p0/errors,        zone: kythuat }
  - { id: jk.p1.soc,        name: "Pack 1 SOC",              unit: "%",  topic: nangluong/jk/p1/soc,           zone: kythuat }
  - { id: jk.p1.voltage,    name: "Pack 1 điện áp",          unit: "V",  topic: nangluong/jk/p1/voltage,       zone: kythuat }
  - { id: jk.p1.current,    name: "Pack 1 dòng điện",        unit: "A",  topic: nangluong/jk/p1/current,       zone: kythuat }
  - { id: jk.p1.power,      name: "Pack 1 sạc/xả",           unit: "W",  topic: nangluong/jk/p1/power,         zone: kythuat }
  - { id: jk.p1.temp,       name: "Pack 1 nóng nhất",        unit: "°C", topic: nangluong/jk/p1/temp,          zone: kythuat }
  - { id: jk.p1.cell_min,   name: "Pack 1 cell thấp nhất",   unit: "mV", topic: nangluong/jk/p1/cell_min,      zone: kythuat }
  - { id: jk.p1.cell_max,   name: "Pack 1 cell cao nhất",    unit: "mV", topic: nangluong/jk/p1/cell_max,      zone: kythuat }
  - { id: jk.p1.cell_delta, name: "Pack 1 chênh lệch cell",  unit: "mV", topic: nangluong/jk/p1/cell_delta,    zone: kythuat }
  - { id: jk.p1.cycles,     name: "Pack 1 số chu kỳ",        unit: "",   topic: nangluong/jk/p1/cycles,        zone: kythuat }
