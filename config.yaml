# Kịch bản một chạm (dashboard + trợ lý giọng nói khớp theo tên, vd "ra khỏi nhà"). Bước: { d: <id thiết bị>, to: on|off }.
# pin: true = cần PIN; kịch bản có bước đụng thiết bị protected/pin cũng cần PIN (trợ lý không chạy được).
