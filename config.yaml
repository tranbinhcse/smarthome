mqtt:
  broker: tcp://mosquitto:1883   # user/mật khẩu lấy từ .env (HUBD_MQTT_USER/PASS)

http:
  listen: ":8080"

db: /db/hubd.db

# Phòng/khu theo tầng. type: panel = tủ điện của tầng (dashboard hiện thành dải CB, không phải phòng).
# Thiết bị gán phòng bằng `zone` (Tuya: sửa tuya/overrides.json rồi chạy gen_config.py).
zones:
  - { id: santruoc,   name: "Sân trước",      floor: 1, type: outdoor }
  - { id: cafe,       name: "Khu cafe",       floor: 1 }
  - { id: bep,        name: "Bếp",            floor: 1 }
  - { id: kho,        name: "Phòng kho",      floor: 1 }
  - { id: wc,         name: "WC",             floor: 1 }
  - { id: sansau,     name: "Sân sau",        floor: 1, type: outdoor }
  - { id: tudien1,    name: "Tủ điện tầng 1", floor: 1, type: panel }
  - { id: lamviec,    name: "Phòng làm việc", floor: 2 }
  - { id: ngu1,       name: "Phòng ngủ 1",    floor: 2 }
  - { id: ngu2,       name: "Phòng ngủ 2",    floor: 2 }
  - { id: docsach,    name: "Phòng đọc sách", floor: 2 }
  - { id: tudien2,    name: "Tủ điện tầng 2", floor: 2, type: panel }
  - { id: kythuat,    name: "Tum kỹ thuật",   floor: 3 }
  - { id: gieng_troi, name: "Giếng trời",     floor: 3, type: outdoor }

# Số đo: giá trị lấy từ một topic MQTT. field/scale: đọc một khoá trong payload JSON rồi nhân hệ số.
# device: hiện số đo trên thẻ của thiết bị đó.
entities:
  # CB Tổng Phòng Lạnh có đo điện (dps Tuya: 19 = W×10, 20 = V×10, 18 = mA)
  - { id: cb_phonglanh.w, name: "Công suất", unit: "W", topic: tuya/ebae9da4b1b5eeec58d8ci/dps, field: "19", scale: 0.1, zone: cafe, device: tuya_ebae9da4b1b5eeec58d8ci }
  - { id: cb_phonglanh.v, name: "Điện áp", unit: "V", topic: tuya/ebae9da4b1b5eeec58d8ci/dps, field: "20", scale: 0.1, zone: cafe, device: tuya_ebae9da4b1b5eeec58d8ci }
  - { id: cb_phonglanh.a, name: "Dòng điện", unit: "A", topic: tuya/ebae9da4b1b5eeec58d8ci/dps, field: "18", scale: 0.001, zone: cafe, device: tuya_ebae9da4b1b5eeec58d8ci }
  # Năng lượng: Deye + 3 pack JK qua node RS485 (chưa lắp — hiện "—" tới khi có dữ liệu)
  - { id: deye.pv,   name: "Điện mặt trời", unit: "W", topic: nangluong/deye/pv_power,   zone: kythuat }
  - { id: deye.load, name: "Tải tiêu thụ",  unit: "W", topic: nangluong/deye/load_power, zone: kythuat }
  - { id: deye.grid, name: "Điện lưới",     unit: "W", topic: nangluong/deye/grid_power, zone: kythuat }
  - { id: jk.soc,    name: "Pin lưu trữ",   unit: "%", topic: nangluong/jk/soc,          zone: kythuat }
  # Node ESP32 (firmware/, chưa lắp — hiện "—" tới khi có dữ liệu). Topic: node-<khu>/sensor/<tên>/state.
  # Vị trí node CHƯA CHỐT (chủ nhà quyết): node không khí thứ ba ở ngu1/ngu2/docsach; máy RO nào gắn node-ro
  # (đổi zone của ro.* là xong, firmware giữ nguyên).
  # Firmware còn gửi pm1, pm10, nox, wifi, nhiet_do_nuoc, luu_luong: không khai báo ở đây vì dashboard gộp mọi
  # µg/m³ thành PM2.5 và mọi °C trong phòng thành nhiệt độ phòng.
  - { id: cafe.t,     name: "Nhiệt độ",      unit: "°C",    zone: cafe,    topic: node-cafe/sensor/nhiet_do/state }
  - { id: cafe.h,     name: "Độ ẩm",         unit: "%",     zone: cafe,    topic: node-cafe/sensor/do_am/state }
  - { id: cafe.co2,   name: "CO₂",           unit: "ppm",   zone: cafe,    topic: node-cafe/sensor/co2/state }
  - { id: cafe.pm,    name: "Bụi mịn PM2.5", unit: "µg/m³", zone: cafe,    topic: node-cafe/sensor/pm25/state }
  - { id: cafe.voc,   name: "Chỉ số VOC",    unit: "",      zone: cafe,    topic: node-cafe/sensor/voc/state }
  - { id: cafe.lux,   name: "Ánh sáng",      unit: "lx",    zone: cafe,    topic: node-cafe/sensor/lux/state }
  - { id: cafe.nguoi, name: "Có người",      unit: "",      zone: cafe,    topic: node-cafe/sensor/co_nguoi/state }
  - { id: lv.t,       name: "Nhiệt độ",      unit: "°C",    zone: lamviec, topic: node-lamviec/sensor/nhiet_do/state }
  - { id: lv.h,       name: "Độ ẩm",         unit: "%",     zone: lamviec, topic: node-lamviec/sensor/do_am/state }
  - { id: lv.co2,     name: "CO₂",           unit: "ppm",   zone: lamviec, topic: node-lamviec/sensor/co2/state }
  - { id: lv.pm,      name: "Bụi mịn PM2.5", unit: "µg/m³", zone: lamviec, topic: node-lamviec/sensor/pm25/state }
  - { id: lv.voc,     name: "Chỉ số VOC",    unit: "",      zone: lamviec, topic: node-lamviec/sensor/voc/state }
  - { id: lv.lux,     name: "Ánh sáng",      unit: "lx",    zone: lamviec, topic: node-lamviec/sensor/lux/state }
  - { id: n1.t,       name: "Nhiệt độ",      unit: "°C",    zone: ngu1,    topic: node-ngu1/sensor/nhiet_do/state }
  - { id: n1.h,       name: "Độ ẩm",         unit: "%",     zone: ngu1,    topic: node-ngu1/sensor/do_am/state }
  - { id: n1.co2,     name: "CO₂",           unit: "ppm",   zone: ngu1,    topic: node-ngu1/sensor/co2/state }
  - { id: n1.pm,      name: "Bụi mịn PM2.5", unit: "µg/m³", zone: ngu1,    topic: node-ngu1/sensor/pm25/state }
  - { id: n1.voc,     name: "Chỉ số VOC",    unit: "",      zone: ngu1,    topic: node-ngu1/sensor/voc/state }
  - { id: n1.lux,     name: "Ánh sáng",      unit: "lx",    zone: ngu1,    topic: node-ngu1/sensor/lux/state }
  - { id: gt.t,       name: "Nhiệt độ",      unit: "°C",    zone: gieng_troi, topic: node-gieng-troi/sensor/nhiet_do/state }
  - { id: gt.h,       name: "Độ ẩm",         unit: "%",     zone: gieng_troi, topic: node-gieng-troi/sensor/do_am/state }
  - { id: gt.lux,     name: "Ánh sáng",      unit: "lx",    zone: gieng_troi, topic: node-gieng-troi/sensor/lux/state }
  - { id: gt.mua,     name: "Mưa",           unit: "",      zone: gieng_troi, topic: node-gieng-troi/sensor/mua/state }
  - { id: ro.tds_in,  name: "Nước nguồn",    unit: "ppm",   zone: cafe,    topic: node-ro/sensor/tds_nguon/state }
  - { id: ro.tds,     name: "Nước sau lọc",  unit: "ppm",   zone: cafe,    topic: node-ro/sensor/tds_sau_loc/state }
  - { id: ro.loai_bo, name: "Tỉ lệ loại bỏ", unit: "%",     zone: cafe,    topic: node-ro/sensor/ti_le_loai_bo/state }
  - { id: ro.loc_l,   name: "Đã lọc hôm nay", unit: "L",    zone: cafe,    topic: node-ro/sensor/da_loc_hom_nay/state }
  - { id: ro.loi,     name: "Lõi lọc còn",   unit: "%",     zone: cafe,    topic: node-ro/sensor/loi_loc_con/state }
  - { id: ro.ro_nuoc, name: "Rò nước",       unit: "",      zone: cafe,    topic: node-ro/sensor/ro_nuoc/state }

# Thiết bị Tuya: phần giữa BEGIN/END do tuya-bridge/gen_config.py sinh từ tuya/devices.json.
# Gắn zone / protected: true bằng cách sửa tay NGOÀI đoạn sinh, hoặc dùng tuya/overrides (xem README).
devices:
  # BEGIN tuya-devices (gen_config.py — đừng sửa tay)
  - {"id": "tuya_eba30c56ca208baad0y43a", "name": "Đèn Kho", "command_topic": "tuya/eba30c56ca208baad0y43a/cmd", "state_topic": "tuya/eba30c56ca208baad0y43a/state", "online_topic": "tuya/eba30c56ca208baad0y43a/online", "kind": "kg", "zone": "kho"}
  - {"id": "tuya_eb89a0372bd6a5acf1owhi", "name": "Đèn phòng lạnh", "command_topic": "tuya/eb89a0372bd6a5acf1owhi/cmd", "state_topic": "tuya/eb89a0372bd6a5acf1owhi/state", "online_topic": "tuya/eb89a0372bd6a5acf1owhi/online", "kind": "kg", "zone": "cafe"}
  - {"id": "tuya_ebae9da4b1b5eeec58d8ci", "name": "CB Tổng Phòng Lạnh Tầng 1", "command_topic": "tuya/ebae9da4b1b5eeec58d8ci/cmd", "state_topic": "tuya/ebae9da4b1b5eeec58d8ci/state", "online_topic": "tuya/ebae9da4b1b5eeec58d8ci/online", "kind": "dlq", "zone": "tudien1", "protected": true}
  - {"id": "tuya_ebbccca6b3cfc09a3as93f", "name": "Sân sau tầng 1", "command_topic": "tuya/ebbccca6b3cfc09a3as93f/cmd", "state_topic": "tuya/ebbccca6b3cfc09a3as93f/state", "online_topic": "tuya/ebbccca6b3cfc09a3as93f/online", "kind": "kg", "zone": "sansau"}
  - {"id": "tuya_eb6564a5a81a53bb8ayyzs", "name": "CB Tổng Bếp", "command_topic": "tuya/eb6564a5a81a53bb8ayyzs/cmd", "state_topic": "tuya/eb6564a5a81a53bb8ayyzs/state", "online_topic": "tuya/eb6564a5a81a53bb8ayyzs/online", "kind": "dlq", "zone": "tudien1", "protected": true}
  - {"id": "tuya_eb0651481bdbe0ca6bvyt0", "name": "CB Tổng Bảng Hiệu", "command_topic": "tuya/eb0651481bdbe0ca6bvyt0/cmd", "state_topic": "tuya/eb0651481bdbe0ca6bvyt0/state", "online_topic": "tuya/eb0651481bdbe0ca6bvyt0/online", "kind": "dlq", "zone": "tudien1", "protected": true}
  - {"id": "tuya_eb700adf4ac4134fea2mrg", "name": "CB Tổng PK T1", "command_topic": "tuya/eb700adf4ac4134fea2mrg/cmd", "state_topic": "tuya/eb700adf4ac4134fea2mrg/state", "online_topic": "tuya/eb700adf4ac4134fea2mrg/online", "kind": "dlq", "zone": "tudien1", "protected": true}
  - {"id": "tuya_ebba01d29a86b4f29dlrgx", "name": "CB Tổng PK Tầng 2 ", "command_topic": "tuya/ebba01d29a86b4f29dlrgx/cmd", "state_topic": "tuya/ebba01d29a86b4f29dlrgx/state", "online_topic": "tuya/ebba01d29a86b4f29dlrgx/online", "kind": "dlq", "zone": "tudien2", "protected": true}
  - {"id": "tuya_ebef59cd6761b0a021jvww", "name": "Ổ cắm Hồ Cá", "command_topic": "tuya/ebef59cd6761b0a021jvww/cmd", "state_topic": "tuya/ebef59cd6761b0a021jvww/state", "online_topic": "tuya/ebef59cd6761b0a021jvww/online", "kind": "pc", "zone": "cafe", "protected": true}
  # END tuya-devices
  # Hồng ngoại qua node ESP32 (firmware/ir.yaml). Bỏ # khi đã lắp module và chốt hãng máy lạnh / học xong mã.
  # Máy lạnh có climate_ir: hub chuyển nguyên mã nút (temp_24, mode_cool...) tới <node>/ir/ac.
  # Một node chỉ có một climate: hai máy lạnh cùng hãng trong phòng nhận chung tín hiệu, khai báo MỘT thiết bị.
  # TV/loa/quạt: codes = chuỗi Pronto học được (firmware/README.md), hub gửi tới <node>/ir/send; nút chưa học bị từ chối.
  # - { id: cafe_ml, name: "Máy lạnh", zone: cafe,    kind: ac, command_topic: node-cafe/ir/ac,    online_topic: node-cafe/status }
  # - { id: lv_ml,   name: "Máy lạnh", zone: lamviec, kind: ac, command_topic: node-lamviec/ir/ac, online_topic: node-lamviec/status }
  # - { id: n1_ml,   name: "Máy lạnh", zone: ngu1,    kind: ac, command_topic: node-ngu1/ir/ac,    online_topic: node-ngu1/status }
  # - id: cafe_tv
  #   name: "TV"
  #   zone: cafe
  #   kind: tv
  #   command_topic: node-cafe/ir/send
  #   online_topic: node-cafe/status
  #   codes:
  #     power:    "0000 006D 0022 0002 0157 00AC 0015 0016 ..."
  #     vol_up:   "0000 006D ..."
  #     vol_down: "0000 006D ..."

