mqtt:
  broker: tcp://mosquitto:1883   # user/mật khẩu lấy từ .env (HUBD_MQTT_USER/PASS)

http:
  listen: ":8080"

db: /db/hubd.db

# Các khu hiển thị trên dashboard (đổi tên cho đúng nhà). Mục không gán zone vào nhóm "Khác".
zones:
  - { id: khu1, name: "Khu vực 1" }
  - { id: khu2, name: "Khu vực 2" }
  - { id: khu3, name: "Khu vực 3" }
  - { id: gieng_troi, name: "Giếng trời" }
  - { id: nang_luong, name: "Năng lượng" }
  - { id: nuoc_ro, name: "Nước RO" }

# Cảm biến: mỗi dòng là một entity, giá trị lấy từ một topic MQTT (ESPHome sẽ gửi vào đây).
entities:
  - { id: demo.nhietdo, name: "Nhiệt độ (demo)", unit: "°C", topic: demo/nhietdo, zone: khu1 }

# Thiết bị Tuya: phần giữa BEGIN/END do tuya-bridge/gen_config.py sinh từ tuya/devices.json.
# Gắn zone / protected: true bằng cách sửa tay NGOÀI đoạn sinh, hoặc dùng tuya/overrides (xem README).
