<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1119">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/dash.css?v=20261027074643">
<title>Biểu đồ</title>
<style>
  body { overflow: auto; background: radial-gradient(120% 80% at 70% 0%, #13283a 0%, #0a1119 60%); min-height: 100dvh; }
  .hist { max-width: 1280px; margin: 0 auto; padding: 18px 20px 32px; display: flex; flex-direction: column; gap: 16px; }
  .hh { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hh h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; flex: 1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; }
  .card { padding: 18px 20px 14px; border-radius: 24px; background: var(--glass); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; font-size: 16px; font-weight: 500; }
</style>
</head>
<body>
<main class="hist">
  <div class="hh"><a class="edit" id="back" href="/" aria-label="Về bảng điều khiển"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1>Biểu đồ</h1><div class="seg" id="ranges" role="tablist" aria-label="Khoảng thời gian"></div></div>
  <div class="cards" id="cards"><p class="empty">Đang tải số liệu...</p></div>
</main>
<div id="loginbox"></div>
<script src="/app.js?v=20261027074643"></script>
<script src="/chart.js?v=20261027074643"></script>
<script src="/demo.js?v=20261027074643"></script>
<script>
const DEMO = new URLSearchParams(location.search).has('demo');
document.getElementById('loginbox').innerHTML = LOGIN_HTML;
if (DEMO) document.getElementById('back').href = '/?demo';
const RANGES = [[6, '6 giờ'], [24, '24 giờ'], [168, '7 ngày'], [720, '30 ngày']];
let hours = 24, cfg, state;

async function series(e) {
  if (DEMO) return demoHist(e.id, e.unit, hours, Number(state[e.id]));
  return (await api(`/api/history?id=${encodeURIComponent(e.id)}&hours=${hours}`)).json();
}
async function draw() {
  document.getElementById('ranges').innerHTML = RANGES.map(([h, l]) => `<button class="rb${h === hours ? ' sel' : ''}" role="tab" aria-selected="${h === hours}" data-h="${h}">${l}</button>`).join('');
  const zone = id => cfg.zones.find(z => z.id === id), groups = [];
  const metric = async (e, label) => chMetric(e, label, await series(e), Number(state[e.id]));
  const power = [['deye.load', 'Tiêu thụ'], ['deye.pv', 'Mặt trời'], ['deye.grid', 'Lưới điện'], ['jk.soc', 'Pin']]
    .map(([id, l]) => [cfg.entities.find(e => e.id === id), l]).filter(([e]) => e);
  if (power.length) groups.push(['dien', 'Điện năng', power]);
  const mcb = cfg.entities.filter(e => e.device && e.unit === 'W' && zone(e.zone));
  if (mcb.length) groups.push(['khu', 'Điện từng khu (MCB)', mcb.map(e => [e, zone(e.zone).name])]);
  for (const z of cfg.zones) {
    const es = cfg.entities.filter(e => e.zone === z.id && !e.device && e.unit && !/^(deye|jk)\./.test(e.id));
    if (es.length) groups.push(['z-' + z.id, z.name, es.map(e => [e, e.name])]);
  }
  const html = await Promise.all(groups.map(async ([id, title, list]) =>
    `<section class="card"><h2>${esc(title)}</h2>${chartHtml(id, await Promise.all(list.map(([e, l]) => metric(e, l))), hours)}</section>`));
  document.getElementById('cards').innerHTML = html.join('') || '<p class="empty">Chưa có số đo nào được ghi lại.</p>';
}
document.addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) { hours = Number(b.dataset.h); draw(); } });
(async () => {
  if (DEMO) ({cfg, state} = DEMO_DATA);
  else { cfg = await (await api('/api/config')).json(); state = await (await api('/api/state')).json(); }
  draw();
})();
</script>
</body>
</html>
