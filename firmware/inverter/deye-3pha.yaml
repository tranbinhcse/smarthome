# Deye hybrid 3 pha: SUN-5..20K-SG04LP3 / SG05LP3 (hạ áp) và SG01HP3 / SG02HP3 (cao áp), cùng dải thanh ghi 5xx–6xx.
# Modbus RTU 9600 8N1, thanh ghi holding (hàm 0x03). CHỈ ĐỌC: chỉ có sensor, không có number/select/switch.
#
# Nguồn thanh ghi (đối chiếu chéo, cùng địa chỉ/hệ số):
#   Lewa-Reka/esphome-deye-inverter @56599c6, pv_inverter/packages/deye_hybrid_3p/{pv,grid,load,battery,inverter}.yaml
#   kellerza/sunsynk, src/sunsynk/definitions/three_phase_common.py + three_phase_lv.py
#   klatremis/esphome-for-deye, "esphome config 10-8-2023.yaml" (Deye 3 pha)
# Dấu gốc của Deye: 590 pin + xả / − sạc; 625 lưới + mua / − bán (sunsynk micro_hybrid_ess.py ghi rõ cùng quy ước).
#
# XÁC NHẬN khi lắp (Giai đoạn 0):
#   - Model đúng là 3 pha (LP3/HP3). Máy 1 pha dùng deye-1pha.yaml, bảng thanh ghi khác hẳn.
#   - Có tải gắn phía lưới (qua CT ngoài) không: 653 chỉ là tải cổng LOAD/backup; tải nhà = 653 + tải phía lưới,
#     lưới tại công-tơ là 619 (External CT) thay vì 625. Điện áp chỉ đăng pha L1 (598; L2 599, L3 600).
#   - Advanced → Paral. Set 3 → Baud Rate = 9600, địa chỉ Modbus khớp ${inverter_modbus_address}.

uart:
  - id: uart_inverter
    tx_pin: ${inverter_tx_pin}
    rx_pin: ${inverter_rx_pin}
    baud_rate: 9600

modbus:
  - id: modbus_inverter
    uart_id: uart_inverter

modbus_controller:
  - id: inverter
    modbus_id: modbus_inverter
    address: ${inverter_modbus_address}
    update_interval: ${inverter_update_interval}

sensor:
  # PV từng MPPT (672–675, W); tổng đăng thành pv_power. Máy ít MPPT đọc 0 ở chuỗi không dùng.
  - { platform: modbus_controller, modbus_controller_id: inverter, id: inv_pv1, internal: true, register_type: holding, address: 672, value_type: U_WORD }
  - { platform: modbus_controller, modbus_controller_id: inverter, id: inv_pv2, internal: true, register_type: holding, address: 673, value_type: U_WORD }
  - { platform: modbus_controller, modbus_controller_id: inverter, id: inv_pv3, internal: true, register_type: holding, address: 674, value_type: U_WORD }
  - { platform: modbus_controller, modbus_controller_id: inverter, id: inv_pv4, internal: true, register_type: holding, address: 675, value_type: U_WORD }
  - platform: combination
    type: sum
    name: Điện mặt trời
    id: inv_pv_power
    state_topic: nangluong/inverter/pv_power
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    sources: [ { source: inv_pv1 }, { source: inv_pv2 }, { source: inv_pv3 }, { source: inv_pv4 } ]

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Tải tiêu thụ
    id: inv_load_power
    state_topic: nangluong/inverter/load_power
    register_type: holding
    address: 653
    value_type: S_WORD
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Điện lưới
    id: inv_grid_power
    state_topic: nangluong/inverter/grid_power
    register_type: holding
    address: 625
    value_type: S_WORD
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Pin sạc xả
    id: inv_battery_power
    state_topic: nangluong/inverter/battery_power
    register_type: holding
    address: 590
    value_type: S_WORD
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    filters:
      - multiply: -1 # Deye + xả → lược đồ + sạc

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: SOC pin
    id: inv_battery_soc
    state_topic: nangluong/inverter/battery_soc
    register_type: holding
    address: 588
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Điện áp lưới
    id: inv_grid_voltage
    state_topic: nangluong/inverter/grid_voltage
    register_type: holding
    address: 598
    value_type: U_WORD
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Tần số lưới
    id: inv_grid_frequency
    state_topic: nangluong/inverter/grid_frequency
    register_type: holding
    address: 609
    value_type: U_WORD
    unit_of_measurement: Hz
    device_class: frequency
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Nhiệt độ inverter
    id: inv_temperature
    state_topic: nangluong/inverter/temperature
    register_type: holding
    address: 541 # tản nhiệt AC; 540 là DC
    value_type: S_WORD
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - offset: -1000
      - multiply: 0.1

  # kWh trong ngày (0,1 kWh/đơn vị), inverter tự về 0 lúc nửa đêm theo đồng hồ của nó.
  - { platform: modbus_controller, modbus_controller_id: inverter, name: PV hôm nay, id: inv_pv_today, state_topic: nangluong/inverter/pv_today, register_type: holding, address: 529, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Tiêu thụ hôm nay, id: inv_load_today, state_topic: nangluong/inverter/load_today, register_type: holding, address: 526, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Mua lưới hôm nay, id: inv_buy_today, state_topic: nangluong/inverter/buy_today, register_type: holding, address: 520, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Bán lưới hôm nay, id: inv_sell_today, state_topic: nangluong/inverter/sell_today, register_type: holding, address: 521, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Sạc pin hôm nay, id: inv_charge_today, state_topic: nangluong/inverter/charge_today, register_type: holding, address: 514, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Xả pin hôm nay, id: inv_discharge_today, state_topic: nangluong/inverter/discharge_today, register_type: holding, address: 515, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
