# Deye hybrid 1 pha hạ áp: SUN-3.6/5/6/8/10/12K-SG0xLP1 (và Sunsynk 1 pha cùng bảng thanh ghi).
# Modbus RTU 9600 8N1, thanh ghi holding (hàm 0x03). CHỈ ĐỌC: chỉ có sensor, không có number/select/switch.
#
# Nguồn thanh ghi (đối chiếu chéo, cùng địa chỉ/hệ số):
#   Lewa-Reka/esphome-deye-inverter @56599c6, pv_inverter/packages/deye_hybrid_1p/{pv,grid,load,battery,inverter}.yaml
#   kellerza/sunsynk, src/sunsynk/definitions/single_phase.py
# Dấu gốc của Deye: 190 pin + xả / − sạc; 169 lưới + mua / − bán (sunsynk micro_hybrid_ess.py ghi rõ cùng quy ước).
#
# XÁC NHẬN khi lắp (Giai đoạn 0):
#   - Model đúng là LP1 (1 pha). Máy 3 pha dùng deye-3pha.yaml, bảng thanh ghi khác hẳn.
#   - Có tải gắn phía lưới (qua CT ngoài) không: 178 chỉ là tải cổng LOAD/backup; tải nhà = 178 + tải phía lưới,
#     lưới tại công-tơ là 172 (External CT) thay vì 169.
#   - Advanced → Paral. Set 3 → Baud Rate = 9600, địa chỉ Modbus khớp ${inverter_modbus_address}.

uart:
  - id: uart_inverter
    tx_pin: ${inverter_tx_pin}
    rx_pin: ${inverter_rx_pin}
    baud_rate: 9600

modbus:
  - id: modbus_inverter
    uart_id: uart_inverter

modbus_controller:
  - id: inverter
    modbus_id: modbus_inverter
    address: ${inverter_modbus_address}
    update_interval: ${inverter_update_interval}

sensor:
  # PV từng MPPT (186–189, W); tổng đăng thành pv_power. Máy ít MPPT đọc 0 ở chuỗi không dùng.
  - { platform: modbus_controller, modbus_controller_id: inverter, id: inv_pv1, internal: true, register_type: holding, address: 186, value_type: U_WORD }
  - { platform: modbus_controller, modbus_controller_id: inverter, id: inv_pv2, internal: true, register_type: holding, address: 187, value_type: U_WORD }
  - { platform: modbus_controller, modbus_controller_id: inverter, id: inv_pv3, internal: true, register_type: holding, address: 188, value_type: U_WORD }
  - { platform: modbus_controller, modbus_controller_id: inverter, id: inv_pv4, internal: true, register_type: holding, address: 189, value_type: U_WORD }
  - platform: combination
    type: sum
    name: Điện mặt trời
    id: inv_pv_power
    state_topic: nangluong/inverter/pv_power
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    sources: [ { source: inv_pv1 }, { source: inv_pv2 }, { source: inv_pv3 }, { source: inv_pv4 } ]

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Tải tiêu thụ
    id: inv_load_power
    state_topic: nangluong/inverter/load_power
    register_type: holding
    address: 178
    value_type: S_WORD
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Điện lưới
    id: inv_grid_power
    state_topic: nangluong/inverter/grid_power
    register_type: holding
    address: 169
    value_type: S_WORD
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Pin sạc xả
    id: inv_battery_power
    state_topic: nangluong/inverter/battery_power
    register_type: holding
    address: 190
    value_type: S_WORD
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    filters:
      - multiply: -1 # Deye + xả → lược đồ + sạc

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: SOC pin
    id: inv_battery_soc
    state_topic: nangluong/inverter/battery_soc
    register_type: holding
    address: 184
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Điện áp lưới
    id: inv_grid_voltage
    state_topic: nangluong/inverter/grid_voltage
    register_type: holding
    address: 150
    value_type: U_WORD
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Tần số lưới
    id: inv_grid_frequency
    state_topic: nangluong/inverter/grid_frequency
    register_type: holding
    address: 79
    value_type: U_WORD
    unit_of_measurement: Hz
    device_class: frequency
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: Nhiệt độ inverter
    id: inv_temperature
    state_topic: nangluong/inverter/temperature
    register_type: holding
    address: 91 # tản nhiệt AC; 90 là biến áp DC
    value_type: S_WORD
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - offset: -1000
      - multiply: 0.1

  # kWh trong ngày (0,1 kWh/đơn vị), inverter tự về 0 lúc nửa đêm theo đồng hồ của nó.
  - { platform: modbus_controller, modbus_controller_id: inverter, name: PV hôm nay, id: inv_pv_today, state_topic: nangluong/inverter/pv_today, register_type: holding, address: 108, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Tiêu thụ hôm nay, id: inv_load_today, state_topic: nangluong/inverter/load_today, register_type: holding, address: 84, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Mua lưới hôm nay, id: inv_buy_today, state_topic: nangluong/inverter/buy_today, register_type: holding, address: 76, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Bán lưới hôm nay, id: inv_sell_today, state_topic: nangluong/inverter/sell_today, register_type: holding, address: 77, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Sạc pin hôm nay, id: inv_charge_today, state_topic: nangluong/inverter/charge_today, register_type: holding, address: 70, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
  - { platform: modbus_controller, modbus_controller_id: inverter, name: Xả pin hôm nay, id: inv_discharge_today, state_topic: nangluong/inverter/discharge_today, register_type: holding, address: 71, value_type: U_WORD, unit_of_measurement: kWh, device_class: energy, accuracy_decimals: 1, filters: [ { multiply: 0.1 } ] }
