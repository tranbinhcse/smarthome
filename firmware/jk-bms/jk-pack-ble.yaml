# Một pack qua BLE (n = số pack như bản RS485, mac = địa chỉ Bluetooth), include từ jk-bms-ble.yaml.
# Cùng id jk_p<n>_* và topic nangluong/jk/p<n>/* với jk-pack.yaml.

ble_client:
  - mac_address: ${mac}
    id: jk_ble${n}

jk_bms_ble:
  - ble_client_id: jk_ble${n}
    protocol_version: JK02_32S   # dòng JK-PB
    throttle: 10s
    id: jk_bms${n}

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: jk_bms${n}
    state_of_charge:
      id: jk_p${n}_soc
      name: "Pin ${n} SOC"
      state_topic: nangluong/jk/p${n}/soc
    total_voltage:
      id: jk_p${n}_voltage
      name: "Pin ${n} điện áp"
      state_topic: nangluong/jk/p${n}/voltage
      accuracy_decimals: 2
    current:
      id: jk_p${n}_current
      name: "Pin ${n} dòng"
      state_topic: nangluong/jk/p${n}/current
      accuracy_decimals: 1
    power:   # + sạc, − xả
      id: jk_p${n}_power
      name: "Pin ${n} công suất"
      state_topic: nangluong/jk/p${n}/power
      accuracy_decimals: 0
    min_cell_voltage:
      id: jk_p${n}_cell_min
      name: "Pin ${n} cell thấp nhất"
      state_topic: nangluong/jk/p${n}/cell_min
      unit_of_measurement: mV
      accuracy_decimals: 0
      filters: [multiply: 1000]
    max_cell_voltage:
      id: jk_p${n}_cell_max
      name: "Pin ${n} cell cao nhất"
      state_topic: nangluong/jk/p${n}/cell_max
      unit_of_measurement: mV
      accuracy_decimals: 0
      filters: [multiply: 1000]
    delta_cell_voltage:
      id: jk_p${n}_cell_delta
      name: "Pin ${n} chênh lệch cell"
      state_topic: nangluong/jk/p${n}/cell_delta
      unit_of_measurement: mV
      accuracy_decimals: 0
      filters: [multiply: 1000]
    charging_cycles:
      id: jk_p${n}_cycles
      name: "Pin ${n} số chu kỳ"
      state_topic: nangluong/jk/p${n}/cycles
      filters: [delta: 0.5]
    temperature_sensor_1:
      id: jk_p${n}_t1
      internal: true
    temperature_sensor_2:
      id: jk_p${n}_t2
      internal: true
    mosfet_temperature:
      id: jk_p${n}_tmos
      internal: true

  - platform: template   # nóng nhất trong 2 cảm biến pin và MOS
    id: jk_p${n}_temp
    name: "Pin ${n} nhiệt độ"
    state_topic: nangluong/jk/p${n}/temp
    unit_of_measurement: °C
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(jk_p${n}_soc).state)) return NAN;   // mất pack: không gửi số cũ (như bản RS485)
      return jkt::largest({id(jk_p${n}_t1).state, id(jk_p${n}_t2).state, id(jk_p${n}_tmos).state});

  - platform: template   # số bit lỗi đang bật; mất kết nối thì NAN như bản RS485
    id: jk_p${n}_alarms
    name: "Pin ${n} số lỗi"
    state_topic: nangluong/jk/p${n}/alarms
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(jk_p${n}_soc).state)) return NAN;
      return jkt::alarms(strtoul(id(jk_p${n}_errors_hex).state.c_str(), nullptr, 16), ${jk_alarm_mask});
    filters: [delta: 0.5]

text_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: jk_bms${n}
    errors:
      name: "Pin ${n} lỗi"
      state_topic: nangluong/jk/p${n}/errors
    errors_bitmask_hex:
      id: jk_p${n}_errors_hex
      internal: true
