services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hub-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    # .env có HUBD_MQTT_ADMIN_PASS thì bật thêm plugin quản lý tài khoản node ESP32; trống = chạy như cũ (start.sh).
    command: sh /start.sh
    environment:
      MQTT_ADMIN_USER: ${HUBD_MQTT_ADMIN_USER:-hubd-admin}
      MQTT_ADMIN_PASS: ${HUBD_MQTT_ADMIN_PASS:-}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/start.sh:/start.sh:ro
      - mosquitto-data:/mosquitto/data   # có cả dynamic-security.json (tài khoản node): đừng xoá volume này

  hubd:
    build: .
    container_name: hubd
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      HUBD_CONFIG: /data/config.yaml
      HUBD_GEN_DIR: /gen   # thiết bị sinh (Tuya sau khi quét QR, camera.yaml từ Cài đặt → Camera), gộp vào config.yaml; file đổi thì hubd tự nạp lại
      HUBD_DB: /db/hubd.db
      HUBD_PIN: ${HUBD_PIN}
      HUBD_MQTT_USER: ${HUBD_MQTT_USER}
      HUBD_MQTT_PASS: ${HUBD_MQTT_PASS}
      # Tài khoản quản trị plugin của Mosquitto: tạo/khoá tài khoản node ESP32 từ dashboard (nodes.go); trống = tắt.
      HUBD_MQTT_ADMIN_USER: ${HUBD_MQTT_ADMIN_USER:-hubd-admin}
      HUBD_MQTT_ADMIN_PASS: ${HUBD_MQTT_ADMIN_PASS:-}
      NVR_HOST: ${NVR_HOST:-}   # camera: cách cũ, trang Cài đặt → Camera có IP đầu ghi thì thắng (camera.go)
      NVR_USER: ${NVR_USER:-}
      NVR_PASS: ${NVR_PASS:-}
      HUBD_CAMERA_TOKEN: ${HUBD_CAMERA_TOKEN:-}   # hikbridge đọc cấu hình đầu ghi qua hubd; trống = tắt API này
      # Trợ lý giọng nói (mục 15.2): token riêng, quyền bằng người chưa nhập PIN; trống = tắt.
      HUBD_ASSISTANT_TOKEN: ${HUBD_ASSISTANT_TOKEN:-}
      HUBD_VOICED_URL: http://voiced:8090
      # HTTPS cổng 8443 (micro, Spotify): trống = hub tự cấp chứng chỉ khi bấm Bật HTTPS trong Cài đặt (tls.go);
      # điền để dùng chứng chỉ riêng (scripts/tls-selfsigned.sh, tên miền thật).
      HUBD_TLS_CERT: ${HUBD_TLS_CERT:-}
      HUBD_TLS_KEY: ${HUBD_TLS_KEY:-}
      # Nhạc trên hub (mục 18.3, music.go): file MP3 trong ./music và USB tự gắn dưới /media; đầu nhận Snapcast nối cổng 1704.
      HUBD_MUSIC_DIRS: /music:/media
      HUBD_SNAP_LISTEN: ":1704"
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - ./music:/music:ro
      - { type: bind, source: /media, target: /media, read_only: true, bind: { propagation: rslave, create_host_path: true } }   # USB cắm sau vẫn hiện
      - tuya-state:/gen   # tuya.yaml do tuya-bridge sinh (energy.json bên cạnh chỉ là số kWh); hubd chỉ ghi camera.yaml
      - hubd-db:/db
      - ./tls:/tls:ro
      # Loa Bluetooth của khu "Loa nối vào hub" (hubout.go): nói với bluetoothd của máy chủ qua D-Bus hệ thống, không chạy
      # bluetoothd trong container. create_host_path: false: máy không có D-Bus thì báo lỗi thay vì tạo thư mục sai chỗ.
      - { type: bind, source: /run/dbus/system_bus_socket, target: /run/dbus/system_bus_socket, bind: { create_host_path: false } }
    devices:
      - /dev/snd:/dev/snd   # khu "Loa nối vào hub": loa cắm jack 3,5 mm hoặc HDMI của hub
    ports:
      - "8080:8080"
      - "8443:8443"
      - "1704:1704"   # đầu nhận nhạc (snapclient) trong LAN

  # Cầu nối Tuya <-> MQTT. network_mode host để TCP ra thiết bị trong LAN (cổng 6668) không qua NAT docker.
  tuya-bridge:
    build: ./tuya-bridge
    container_name: tuya-bridge
    restart: unless-stopped
    depends_on: [mosquitto]
    network_mode: host
    environment:
      MQTT_HOST: 127.0.0.1
      MQTT_USER: ${TUYA_MQTT_USER}
      MQTT_PASS: ${TUYA_MQTT_PASS}
      TUYA_DIR: /tuya
      TUYA_STATE: /state/energy.json
      TUYA_GEN: /state/tuya.yaml
    volumes:
      - ./tuya:/tuya      # devices.json (+ overrides.json) — chứa local key, KHÔNG commit; quét QR trên dashboard ghi lại
      - tuya-state:/state # tổng kWh cộng dồn từ add_ele; tuya.yaml = cấu hình Tuya sinh cho hubd sau khi quét QR

  # Camera Hikvision (mục 15.1). Chỉ chạy khi .env có COMPOSE_PROFILES=camera; đầu ghi (tài khoản chỉ có quyền xem)
  # nhập trên dashboard: Cài đặt → Camera. Lõi không phụ thuộc hai dịch vụ này.
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: hub-go2rtc
    restart: unless-stopped
    profiles: [camera]
    volumes:   # không giữ tài khoản đầu ghi: hubd gửi nguồn RTSP mỗi lần mở luồng
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:   # chỉ cổng media WebRTC; API 1984 không mở, hubd gọi qua mạng Docker
      - "8555:8555/tcp"
      - "8555:8555/udp"

  hikbridge:
    build: { context: ., dockerfile: hikbridge/Dockerfile }
    container_name: hikbridge
    restart: unless-stopped
    profiles: [camera]
    depends_on: [mosquitto, hubd]
    environment:
      HUBD_URL: http://hubd:8080
      HUBD_CAMERA_TOKEN: ${HUBD_CAMERA_TOKEN:-}   # trống thì dùng NVR_* bên dưới (cách cũ)
      NVR_HOST: ${NVR_HOST:-}
      NVR_USER: ${NVR_USER:-}
      NVR_PASS: ${NVR_PASS:-}
      MQTT_HOST: mosquitto
      MQTT_USER: ${HIK_MQTT_USER:-hik}
      MQTT_PASS: ${HIK_MQTT_PASS:-}

  # Trợ lý giọng nói: STT/TTS cục bộ; câu tự do qua AI tương thích OpenAI (URL/khoá/model nhập ở trang Cài đặt,
  # đọc từ hubd bằng token trợ lý). Không mở cổng: dashboard đi qua hubd /voice/*.
  # Tắt service này thì lõi (luật, cảnh báo, điều khiển) vẫn chạy đủ.
  voiced:
    build: ./voiced
    container_name: voiced
    profiles: ["voice"]   # tuỳ chọn: thêm voice vào COMPOSE_PROFILES trong .env (README mục Trợ lý)
    restart: unless-stopped
    depends_on: [mosquitto, hubd]
    environment:
      HUBD_URL: http://hubd:8080
      HUBD_ASSISTANT_TOKEN: ${HUBD_ASSISTANT_TOKEN:-}
      MQTT_HOST: mosquitto
      MQTT_USER: ${VOICED_MQTT_USER:-}
      MQTT_PASS: ${VOICED_MQTT_PASS:-}
    volumes:
      - voiced-cache:/cache   # âm thanh đã đọc (cache theo câu)

volumes:
  mosquitto-data:
  hubd-db:
  tuya-state:
  voiced-cache:
