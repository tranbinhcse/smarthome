services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hub-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

  hubd:
    build: .
    container_name: hubd
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      HUBD_CONFIG: /data/config.yaml
      HUBD_DB: /db/hubd.db
      HUBD_PIN: ${HUBD_PIN}
      HUBD_MQTT_USER: ${HUBD_MQTT_USER}
      HUBD_MQTT_PASS: ${HUBD_MQTT_PASS}
      NVR_HOST: ${NVR_HOST:-}   # camera: ảnh chụp ISAPI đi qua hubd (camera.go)
      NVR_USER: ${NVR_USER:-}
      NVR_PASS: ${NVR_PASS:-}
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - hubd-db:/db
    ports:
      - "8080:8080"

  # Cầu nối Tuya <-> MQTT. network_mode host để TCP ra thiết bị trong LAN (cổng 6668) không qua NAT docker.
  tuya-bridge:
    build: ./tuya-bridge
    container_name: tuya-bridge
    restart: unless-stopped
    depends_on: [mosquitto]
    network_mode: host
    environment:
      MQTT_HOST: 127.0.0.1
      MQTT_USER: ${TUYA_MQTT_USER}
      MQTT_PASS: ${TUYA_MQTT_PASS}
      TUYA_DIR: /tuya
    volumes:
      - ./tuya:/tuya:ro   # devices.json (+ overrides.json) — chứa local key, KHÔNG commit

  # Camera Hikvision (mục 15.1). Chỉ chạy khi .env có COMPOSE_PROFILES=camera và NVR_HOST/NVR_USER/NVR_PASS
  # (tài khoản đầu ghi chỉ có quyền xem). Lõi không phụ thuộc hai dịch vụ này.
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: hub-go2rtc
    restart: unless-stopped
    profiles: [camera]
    environment:
      NVR_HOST: ${NVR_HOST:-}
      NVR_USER: ${NVR_USER:-}
      NVR_PASS: ${NVR_PASS:-}
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:   # chỉ cổng media WebRTC; API 1984 không mở, hubd gọi qua mạng Docker
      - "8555:8555/tcp"
      - "8555:8555/udp"

  hikbridge:
    build: { context: ., dockerfile: hikbridge/Dockerfile }
    container_name: hikbridge
    restart: unless-stopped
    profiles: [camera]
    depends_on: [mosquitto]
    environment:
      NVR_HOST: ${NVR_HOST:-}
      NVR_USER: ${NVR_USER:-}
      NVR_PASS: ${NVR_PASS:-}
      MQTT_HOST: mosquitto
      MQTT_USER: ${HIK_MQTT_USER:-hik}
      MQTT_PASS: ${HIK_MQTT_PASS:-}

volumes:
  mosquitto-data:
  hubd-db:
