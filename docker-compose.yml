services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hub-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

  hubd:
    build: .
    container_name: hubd
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      HUBD_CONFIG: /data/config.yaml
      HUBD_GEN_DIR: /gen   # thiết bị Tuya sinh sau khi quét QR, gộp vào config.yaml; file đổi thì hubd tự nạp lại
      HUBD_DB: /db/hubd.db
      HUBD_PIN: ${HUBD_PIN}
      HUBD_MQTT_USER: ${HUBD_MQTT_USER}
      HUBD_MQTT_PASS: ${HUBD_MQTT_PASS}
      NVR_HOST: ${NVR_HOST:-}   # camera: ảnh chụp ISAPI đi qua hubd (camera.go)
      NVR_USER: ${NVR_USER:-}
      NVR_PASS: ${NVR_PASS:-}
      # Trợ lý giọng nói (mục 15.2): token riêng, quyền bằng người chưa nhập PIN; trống = tắt.
      HUBD_ASSISTANT_TOKEN: ${HUBD_ASSISTANT_TOKEN:-}
      HUBD_VOICED_URL: http://voiced:8090
      # HTTPS cổng 8443 cho nút nói trên iPad (scripts/tls-selfsigned.sh); trống = chỉ HTTP.
      HUBD_TLS_CERT: ${HUBD_TLS_CERT:-}
      HUBD_TLS_KEY: ${HUBD_TLS_KEY:-}
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - tuya-state:/gen:ro   # chỉ đọc tuya.yaml do tuya-bridge sinh (energy.json bên cạnh chỉ là số kWh)
      - hubd-db:/db
      - ./tls:/tls:ro
    ports:
      - "8080:8080"
      - "8443:8443"

  # Cầu nối Tuya <-> MQTT. network_mode host để TCP ra thiết bị trong LAN (cổng 6668) không qua NAT docker.
  tuya-bridge:
    build: ./tuya-bridge
    container_name: tuya-bridge
    restart: unless-stopped
    depends_on: [mosquitto]
    network_mode: host
    environment:
      MQTT_HOST: 127.0.0.1
      MQTT_USER: ${TUYA_MQTT_USER}
      MQTT_PASS: ${TUYA_MQTT_PASS}
      TUYA_DIR: /tuya
      TUYA_STATE: /state/energy.json
      TUYA_GEN: /state/tuya.yaml
    volumes:
      - ./tuya:/tuya      # devices.json (+ overrides.json) — chứa local key, KHÔNG commit; quét QR trên dashboard ghi lại
      - tuya-state:/state # tổng kWh cộng dồn từ add_ele; tuya.yaml = cấu hình Tuya sinh cho hubd sau khi quét QR

  # Camera Hikvision (mục 15.1). Chỉ chạy khi .env có COMPOSE_PROFILES=camera và NVR_HOST/NVR_USER/NVR_PASS
  # (tài khoản đầu ghi chỉ có quyền xem). Lõi không phụ thuộc hai dịch vụ này.
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: hub-go2rtc
    restart: unless-stopped
    profiles: [camera]
    environment:
      NVR_HOST: ${NVR_HOST:-}
      NVR_USER: ${NVR_USER:-}
      NVR_PASS: ${NVR_PASS:-}
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:   # chỉ cổng media WebRTC; API 1984 không mở, hubd gọi qua mạng Docker
      - "8555:8555/tcp"
      - "8555:8555/udp"

  hikbridge:
    build: { context: ., dockerfile: hikbridge/Dockerfile }
    container_name: hikbridge
    restart: unless-stopped
    profiles: [camera]
    depends_on: [mosquitto]
    environment:
      NVR_HOST: ${NVR_HOST:-}
      NVR_USER: ${NVR_USER:-}
      NVR_PASS: ${NVR_PASS:-}
      MQTT_HOST: mosquitto
      MQTT_USER: ${HIK_MQTT_USER:-hik}
      MQTT_PASS: ${HIK_MQTT_PASS:-}

  # Trợ lý giọng nói: STT/TTS cục bộ; câu tự do qua AI tương thích OpenAI (URL/khoá/model nhập ở trang Cài đặt,
  # đọc từ hubd bằng token trợ lý). Không mở cổng: dashboard đi qua hubd /voice/*.
  # Tắt service này thì lõi (luật, cảnh báo, điều khiển) vẫn chạy đủ.
  voiced:
    build: ./voiced
    container_name: voiced
    profiles: ["voice"]   # tuỳ chọn: thêm voice vào COMPOSE_PROFILES trong .env (README mục Trợ lý)
    restart: unless-stopped
    depends_on: [mosquitto, hubd]
    environment:
      HUBD_URL: http://hubd:8080
      HUBD_ASSISTANT_TOKEN: ${HUBD_ASSISTANT_TOKEN:-}
      MQTT_HOST: mosquitto
      MQTT_USER: ${VOICED_MQTT_USER:-}
      MQTT_PASS: ${VOICED_MQTT_PASS:-}
    volumes:
      - voiced-cache:/cache   # âm thanh đã đọc (cache theo câu)

volumes:
  mosquitto-data:
  hubd-db:
  tuya-state:
  voiced-cache:
