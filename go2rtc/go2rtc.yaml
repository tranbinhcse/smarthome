# go2rtc (mục 15.1): RTSP luồng phụ H.264 của đầu ghi -> WebRTC/MSE cho trình duyệt, không chuyển mã.
# API (1984) chỉ nằm trong mạng Docker: hubd gọi tới sau khi kiểm PIN, trình duyệt không gọi thẳng.
# Không khai báo luồng, không giữ tài khoản đầu ghi: mỗi lần mở luồng hubd gửi name=ch<kênh>&src=rtsp://... dựng từ
# trang Cài đặt → Camera (hoặc NVR_* trong .env), nên đổi tài khoản có hiệu lực từ lần xem kế tiếp (camera.go).
# RTSP cổng 554, luồng phụ /Streaming/Channels/<kênh>02. Luồng chỉ mở tới đầu ghi khi có người xem.
api:
  listen: ":1984"
rtsp:
  listen: ""                 # không phát lại luồng ra mạng
webrtc:
  listen: ":8555"            # chỉ media (DTLS-SRTP), không có API
  candidates:
    - 192.168.1.254:8555     # IP máy Ubuntu trong LAN
